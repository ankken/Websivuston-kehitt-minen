<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ota yhteyttä - Annan sivut</title>
    <style>
        body { background-color: rgb(108, 104, 108); font-family: sans-serif; color: white; padding: 20px; }
        form { display: flex; flex-direction: column; max-width: 300px; gap: 10px; }
        input, textarea { padding: 8px; border-radius: 4px; border: none; }
        input[type="submit"] { background-color: #d31d7b; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <nav><a href="index.html" style="color: lightblue;">Takaisin kotiin</a></nav>
    <h1>Ota yhteyttä</h1>
    <form>
        <label>Nimi:</label>
        <input type="text" placeholder="Nimesi tähän">
        <label>Viesti:</label>
        <textarea rows="4"></textarea>
        <input type="submit" value="Lähetä">
    </form>
</body>
</html>
